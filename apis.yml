aid: qiniu
name: Qiniu Cloud
description: >-
  Qiniu Cloud (七牛云) is a data-centric cloud infrastructure platform for storing,
  delivering, processing, and computing over large-scale unstructured data. Its
  core products are Object Storage (Kodo), CDN and full-site acceleration (DCDN),
  live and on-demand audio/video PaaS, intelligent media processing (Dora), and
  AI large-model inference and agent workflows. Developers integrate over REST
  APIs authenticated with AccessKey/SecretKey HMAC signatures, first-party SDKs in
  a dozen languages, the qshell CLI, and an official MCP server. This profile was
  seeded as a portfolio company of Qiming Venture Partners and enriched from
  Qiniu's public developer surface (developer.qiniu.com, github.com/qiniu).
